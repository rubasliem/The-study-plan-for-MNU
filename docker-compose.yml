version: '3.8'

services:
  # 1. قاعدة البيانات (PostgreSQL)
  db:
    image: postgres:15-alpine
    container_name: mnu_postgres
    restart: always
    environment:
      POSTGRES_USER: mnu_admin
      POSTGRES_PASSWORD: mnu_password_2026
      POSTGRES_DB: mnu_study_plan
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - mnu_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mnu_admin -d mnu_study_plan"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. الخادم الخلفي (Backend - FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: mnu-backend:latest
    container_name: mnu_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://mnu_admin:mnu_password_2026@db:5432/mnu_study_plan
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mnu_network

  # 3. الواجهة الأمامية (Frontend - React + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: mnu-frontend:latest
    container_name: mnu_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - mnu_network

volumes:
  pgdata:
    driver: local

networks:
  mnu_network:
    driver: bridge